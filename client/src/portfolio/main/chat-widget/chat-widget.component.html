<div class="chat-widget" [class.open]="isOpen">
    @if (isOpen) {
    <div class="chat-panel" role="dialog" aria-label="Portfolio AI assistant">
        <div class="chat-header">
            <div class="chat-header-info">
                <span class="chat-dot"></span>
                <span class="chat-title">Ask {{ portfolio.personal.name.split(' ')[0] }}'s AI</span>
            </div>
            <button class="chat-close" type="button" (click)="closeChat()" aria-label="Close chat">&times;</button>
        </div>

        <div class="chat-messages" #messagesEl>
            @for (msg of messages; track $index) {
            <div class="chat-bubble" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
                {{ msg.content }}
            </div>
            }
            @if (isSending) {
            <div class="chat-bubble assistant typing" aria-label="Assistant is typing">
                <span></span><span></span><span></span>
            </div>
            }
        </div>

        @if (messages.length <= 1) {
        <div class="chat-suggestions">
            @for (suggestion of suggestions; track suggestion) {
            <button type="button" class="chip" (click)="sendSuggestion(suggestion)">{{ suggestion }}</button>
            }
        </div>
        }

        <form class="chat-input-row" (ngSubmit)="send()">
            <textarea
                rows="1"
                placeholder="Ask about my experience, skills, projects..."
                [(ngModel)]="draft"
                name="chatDraft"
                (keydown)="onKeydown($event)"
            ></textarea>
            <button type="submit" class="chat-send" [disabled]="isSending || !draft.trim()" aria-label="Send message">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M3 11.5 20.5 3 15 20.5l-3.5-7L3 11.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
            </button>
        </form>
    </div>
    }

    <button class="chat-launcher" type="button" (click)="toggleOpen()" [attr.aria-expanded]="isOpen" aria-label="Toggle AI chat assistant">
        @if (!isOpen) {
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M12 3C6.98 3 3 6.58 3 11c0 2.44 1.24 4.62 3.2 6.08V21l3.6-2.06c.7.15 1.44.23 2.2.23 5.02 0 9-3.58 9-8s-3.98-8-9-8Z" fill="currentColor"/>
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        }
    </button>
</div>
