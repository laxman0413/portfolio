<section id="skills" class="skills-section">
	<div class="skills-container">
		<h2 class="section-title">My <strong>Skills</strong></h2>
	</div>

	<div class="skills-grid">
		@for (skill of portfolio.skills; track skill.name) {
			<div class="skill-card" [class.dark]="skill.isDark">
				<img [src]="'assets/icons/icon-' + skill.icon+ '.svg'" [alt]="skill.name + ' icon'" class="skill-icon">
				<span class="skill-name">{{ skill.name }}</span>
			</div>
		}
	</div>
</section>
