<div class="page-shell">
    <div class="navbar" [class.menu-open]="isMenuOpen">
        <div class="mx-auto grid w-full max-w-7xl grid-cols-[auto_1fr_auto] items-center gap-4 px-4 py-5 sm:px-6 lg:px-10">
            <a class="brand" href="#home">
                <span class="name">Personal</span>
            </a>

            <nav class="hidden justify-center gap-6 text-sm md:flex" id="primary-navigation" aria-label="Primary navigation">
                <a class="nav-link" href="#about">About Me</a>
                <a class="nav-link" href="#experience">Experience</a>
                <a class="nav-link" href="#projects">Projects</a>
                <a class="nav-link" href="#skills">Skills</a>
                <a class="nav-link" href="#contact">Contact</a>
            </nav>

            <div class="flex items-center justify-end gap-2">
                <button class="resume hidden md:inline-flex" (click)="openResume()">
                    Resume
                </button>

                <button
                    class="menu-toggle grid h-11 w-11 place-items-center rounded-xl border border-[#0b0b0b] bg-white text-[#0b0b0b] md:hidden"
                    type="button"
                    (click)="toggleMenu()"
                    [attr.aria-expanded]="isMenuOpen"
                    aria-controls="mobile-nav"
                    aria-label="Toggle navigation menu">
                    @if (!isMenuOpen) {
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    } @else {
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    }
                </button>
            </div>
        </div>

        @if (isMenuOpen) {
        <nav id="mobile-nav" class="flex flex-col gap-1 border-t border-black/10 px-4 pb-4 pt-2 text-sm md:hidden" aria-label="Mobile navigation">
            <a class="mobile-nav-link" href="#about" (click)="closeMenu()">About Me</a>
            <a class="mobile-nav-link" href="#experience" (click)="closeMenu()">Experience</a>
            <a class="mobile-nav-link" href="#projects" (click)="closeMenu()">Projects</a>
            <a class="mobile-nav-link" href="#skills" (click)="closeMenu()">Skills</a>
            <a class="mobile-nav-link" href="#contact" (click)="closeMenu()">Contact</a>
            <button class="resume mt-2 w-full justify-center" (click)="openResume(); closeMenu()">Resume</button>
        </nav>
        }
    </div>

    @if (loading) {
    <section class="loading-panel">
        <div class="loader"></div>
        <p>Loading portfolio data...</p>
    </section>
    } @else if (errorMessage) {
    <section class="status-panel error">
        <h2>Something went wrong</h2>
        <p>{{ errorMessage }}</p>
    </section>
    } @else {
    @if (portfolio) {
    <main>
        <app-home [portfolio]="portfolio"></app-home>
        <app-about [portfolio]="portfolio"></app-about>
        <app-experience [portfolio]="portfolio"></app-experience>
        <app-skills [portfolio]="portfolio"></app-skills>
        <app-projects [portfolio]="portfolio"></app-projects>
        <app-contact [portfolio]="portfolio"></app-contact>
    </main>

    <footer class="footer">
        <a class="brand" href="#home">
            <img src="assets/icons/logo.svg" alt="Logo" class="logo">
            <span class="name">Personal</span>
        </a>
        <div>
            <span> All rights reserved.</span>
        </div>
    </footer>

    <app-chat-widget [portfolio]="portfolio"></app-chat-widget>
    }
    }
</div>
