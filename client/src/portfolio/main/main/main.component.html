<div class="page-shell">
    <div class="navbar" [class.menu-open]="isMenuOpen">
        <a class="brand" href="#home">
            <span class="name">Personal</span>
        </a>

        <button
            class="menu-toggle"
            type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen"
            aria-controls="primary-navigation"
            aria-label="Toggle navigation menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" id="primary-navigation" aria-label="Primary navigation" [class.open]="isMenuOpen">
            <a href="#about" (click)="closeMenu()">About Me</a>
            <a href="#experience" (click)="closeMenu()">Experience</a>
            <a href="#projects" (click)="closeMenu()">Projects</a>
            <a href="#skills" (click)="closeMenu()">Skills</a>
            <a href="#contact" (click)="closeMenu()">Contact</a>
        </nav>

        <div class="resume-wrap">
            <button class="resume" (click)="openResume()">
                Resume
            </button>
        </div>
    </div>

    @if (loading) {
    <section class="loading-panel">
        <div class="loader"></div>
        <p>Loading portfolio data...</p>
    </section>
    } @else if (errorMessage) {
    <section class="status-panel error">
        <h2>Something went wrong</h2>
        <p>{{ errorMessage }}</p>
    </section>
    } @else {
    @if (portfolio) {
    <main>
        <app-home [portfolio]="portfolio"></app-home>
        <app-about [portfolio]="portfolio"></app-about>
        <app-experience [portfolio]="portfolio"></app-experience>
        <app-skills [portfolio]="portfolio"></app-skills>
        <app-projects [portfolio]="portfolio"></app-projects>
        <app-contact [portfolio]="portfolio"></app-contact>
    </main>

    <footer class="footer">
        <a class="brand" href="#home">
            <img src="assets/icons/logo.svg" alt="Logo" class="logo">
            <span class="name">Personal</span>
        </a>
        <div>
            <span> All rights reserved.</span>
        </div>
    </footer>
    }
    }
</div>
